<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Clickzle</title>
<meta name="description" content="Manage your Clickzle account — update your email, country and password.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="/assets/js/auth.js"></script>
<script>
  // Redirect to login if not logged in — runs before render
  (function(){
    try {
      const token = localStorage.getItem('cz_token');
      if (!token) { window.location.replace('/login.html'); return; }
      const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if (payload.exp <= Math.floor(Date.now()/1000)) window.location.replace('/login.html');
    } catch(e) { window.location.replace('/login.html'); }
  })();
</script>
<style>

/* ═══ TOKENS ══════════════════════════════════════════════════════════════ */
:root {
  --bg:#0a0a0a; --surface:#141414; --surface2:#1e1e1e;
  --border:#222; --border2:#2e2e2e;
  --text:#f0f0f0; --text2:#b0b0b0; --text3:#888;
  --accent:#4ade80;
  --accent-dim:rgba(74,222,128,0.08);
  --accent-border:rgba(74,222,128,0.22);
  --green:#4ade80; --red:#f87171;
}
body.light {
  --bg:#f4f4f4; --surface:#fff; --surface2:#ebebeb;
  --border:#d0d0d0; --border2:#c0c0c0;
  --text:#111; --text2:#444; --text3:#777;
  --accent-dim:rgba(74,222,128,0.12);
  --accent-border:rgba(74,222,128,0.28);
}

/* ═══ RESET ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden;
}

/* ═══ BACKGROUND ══════════════════════════════════════════════════════════ */
.bg-grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
  background-size:72px 72px;
}
.bg-radial{
  position:fixed; top:-200px; left:50%; transform:translateX(-50%);
  width:800px; height:500px;
  background:radial-gradient(ellipse, rgba(74,222,128,0.07) 0%, transparent 68%);
  pointer-events:none; z-index:0;
}
body.light .bg-grid{display:none;}
body.light .bg-radial{opacity:0.2;}

/* ═══ HEADER ══════════════════════════════════════════════════════════════ */
.site-header{
  position:sticky; top:0; z-index:100;
  background:rgba(10,10,10,0.88); backdrop-filter:blur(18px);
}
.site-header::after{
  content:""; position:absolute; bottom:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(74,222,128,0.15) 20%,rgba(74,222,128,0.9) 50%,rgba(74,222,128,0.15) 80%,transparent 100%);
}
body.light .site-header{background:rgba(244,244,244,0.92);}
body.light .site-header::after{background:linear-gradient(90deg,transparent 0%,rgba(74,222,128,0.1) 20%,rgba(74,222,128,0.6) 50%,rgba(74,222,128,0.1) 80%,transparent 100%);}
.hdr-inner{
  max-width:1120px; margin:0 auto; padding:0 28px; height:62px;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
}
.site-logo{
  font-family:'Bebas Neue',sans-serif; font-size:26px;
  letter-spacing:3px; color:var(--text); text-decoration:none;
  justify-self:start;
}
.site-logo span{color:var(--accent);}
.hdr-center{
  display:flex; align-items:center; gap:8px;
  font-size:12px; color:var(--text3); letter-spacing:0.3px;
  justify-self:center;
}
.hdr-reset-label{ font-weight:500; white-space:nowrap; color:var(--text2); }
.hdr-timer{ font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:var(--text2); }
.hdr-sep{ color:var(--border2); font-size:14px; margin:0 2px; }
.nav-game-num{
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:6px;
  border:1px solid var(--border2); background:var(--surface2);
  font-size:11px; font-weight:700; color:var(--text2);
  text-decoration:none; transition:all 0.18s; font-family:'DM Sans',sans-serif;
}
.nav-game-num:hover{ opacity:0.85; }
.nav-game-num[data-game="1"]{color:#4ade80;border-color:color-mix(in srgb,#4ade80 35%,transparent);background:color-mix(in srgb,#4ade80 8%,transparent);}
.nav-game-num[data-game="1"]:hover{border-color:#4ade80;background:color-mix(in srgb,#4ade80 18%,transparent);}
.nav-game-num[data-game="2"]{color:#60a5fa;border-color:color-mix(in srgb,#60a5fa 35%,transparent);background:color-mix(in srgb,#60a5fa 8%,transparent);}
.nav-game-num[data-game="2"]:hover{border-color:#60a5fa;background:color-mix(in srgb,#60a5fa 18%,transparent);}
.nav-game-num[data-game="3"]{color:#f472b6;border-color:color-mix(in srgb,#f472b6 35%,transparent);background:color-mix(in srgb,#f472b6 8%,transparent);}
.nav-game-num[data-game="3"]:hover{border-color:#f472b6;background:color-mix(in srgb,#f472b6 18%,transparent);}
.nav-game-num[data-game="4"]{color:#facc15;border-color:color-mix(in srgb,#facc15 35%,transparent);background:color-mix(in srgb,#facc15 8%,transparent);}
.nav-game-num[data-game="4"]:hover{border-color:#facc15;background:color-mix(in srgb,#facc15 18%,transparent);}
.nav-game-num[data-game="5"]{color:#a78bfa;border-color:color-mix(in srgb,#a78bfa 35%,transparent);background:color-mix(in srgb,#a78bfa 8%,transparent);}
.nav-game-num[data-game="5"]:hover{border-color:#a78bfa;background:color-mix(in srgb,#a78bfa 18%,transparent);}
.hdr-right{display:flex;align-items:center;gap:20px;justify-self:end;}
.icon-btn{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--border2);cursor:pointer;color:var(--text2);
  border-radius:8px;transition:background 0.15s,color 0.15s;
}
.icon-btn:hover{background:var(--surface2);color:var(--text);}
.icon-btn svg{width:16px;height:16px;}

/* ═══ FOOTER ══════════════════════════════════════════════════════════════ */
.site-footer{ border-top:1px solid var(--border); padding:44px 0; position:relative; z-index:1; }
.ftr-inner{
  max-width:1120px; margin:0 auto; padding:0 28px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px;
}
.ftr-logo{ font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:3px; color:var(--text2); }
.ftr-logo span{ color:var(--accent); }
.ftr-links{ display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
.ftr-link{ font-size:13px; color:var(--text3); text-decoration:none; transition:color 0.18s; }
.ftr-link:hover{ color:var(--text2); }
.ftr-copy{ font-size:12px; color:var(--text3); width:100%; text-align:center; margin-top:16px; padding-top:20px; border-top:1px solid var(--border); }

/* ═══ PAGE LAYOUT ═════════════════════════════════════════════════════════ */
.page-wrap{
  position:relative; z-index:1;
  min-height:calc(100vh - 62px);
  padding:40px 28px 80px;
}
.account-wrap{
  max-width:1120px; margin:0 auto;
}

/* ═══ TWO-COLUMN GRID ═════════════════════════════════════════════════════ */
.acct-grid{
  display:grid; grid-template-columns:1fr 380px;
  gap:20px; align-items:start;
}
@media(max-width:960px){
  .acct-grid{ grid-template-columns:1fr; }
}

/* ═══ GAME STAT CARDS ═════════════════════════════════════════════════════ */
.game-stats-section{
  display:flex; flex-direction:column; gap:16px;
}
.gsc-card{
  background:var(--surface); border:1px solid var(--border2);
  border-radius:16px; overflow:hidden;
}
.gsc-header{
  display:flex; align-items:center; gap:12px;
  padding:16px 20px 14px;
  border-bottom:1px solid var(--border2);
}
.gsc-badge{
  width:32px; height:32px; border-radius:8px; flex-shrink:0;
  font-family:'Bebas Neue',sans-serif; font-size:17px;
  display:flex; align-items:center; justify-content:center;
}
.gsc-game-name{
  font-family:'Bebas Neue',sans-serif; font-size:17px;
  letter-spacing:1.5px; flex:1;
}
.gsc-best-tag{
  font-size:11px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; padding:3px 10px;
  border-radius:20px;
}
.gsc-plays{
  font-size:12px; color:var(--text3);
}
.gsc-score-table{
  width:100%;
}
.gsc-row{
  display:grid; grid-template-columns:28px 1fr 1fr auto;
  align-items:center; gap:8px;
  padding:10px 20px; border-bottom:1px solid var(--border);
}
.gsc-row:last-child{ border-bottom:none; }
.gsc-rank{
  font-size:11px; font-weight:700; color:var(--text3);
  text-align:center;
}
.gsc-rank.top{ color:var(--accent); }
.gsc-score-val{
  font-family:'Bebas Neue',sans-serif; font-size:22px;
  letter-spacing:1px;
}
.gsc-date{
  font-size:11px; color:var(--text3); text-align:right;
}
.gsc-time{
  font-size:11px; color:var(--text3); text-align:right;
}
.gsc-empty{
  padding:18px 20px; font-size:13px; color:var(--text3); text-align:center;
}

/* ═══ SETTINGS COLUMN ═════════════════════════════════════════════════════ */
.settings-col{
  display:flex; flex-direction:column; gap:14px;
}

/* ═══ PROFILE HEADER ══════════════════════════════════════════════════════ */
.profile-header{
  display:flex; align-items:center; gap:16px; margin-bottom:24px;
}
.profile-avatar{
  width:54px; height:54px; border-radius:50%; flex-shrink:0;
  background:var(--accent-dim); border:2px solid var(--accent-border);
  color:var(--accent); font-size:18px; font-weight:700; letter-spacing:1px;
  display:flex; align-items:center; justify-content:center;
}
.profile-name-block{ flex:1; min-width:0; }
.profile-username{
  font-family:'Bebas Neue',sans-serif; font-size:22px;
  letter-spacing:2px; color:var(--text);
}
.profile-meta{ font-size:12px; color:var(--text3); margin-top:3px; }
.profile-back{
  font-size:13px; font-weight:500; color:var(--text2);
  text-decoration:none; white-space:nowrap;
  border:1px solid var(--border2); border-radius:8px; padding:6px 14px;
  transition:color 0.15s, border-color 0.15s;
}
.profile-back:hover{ color:var(--text); border-color:var(--border2); }

/* ═══ STATS ROW ═══════════════════════════════════════════════════════════ */
.stats-row{
  display:flex; gap:10px; margin-bottom:20px;
}
.stat-pill{
  flex:1; background:var(--surface); border:1px solid var(--border2);
  border-radius:12px; padding:14px 10px; text-align:center;
}
.stat-num{
  display:block; font-family:'Bebas Neue',sans-serif;
  font-size:28px; letter-spacing:1px; color:var(--text);
  line-height:1;
}
.stat-label{
  display:block; font-size:10px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase;
  color:var(--text3); margin-top:4px;
}

/* ═══ ACCOUNT CARD ════════════════════════════════════════════════════════ */
.account-card{
  background:var(--surface); border:1px solid var(--border2);
  border-radius:16px; padding:28px;
}
.account-card + .account-card{ margin-top:14px; }
.card-title{
  font-family:'Bebas Neue',sans-serif; font-size:18px;
  letter-spacing:2px; color:var(--text); margin-bottom:20px;
}

/* ═══ FORM FIELDS ═════════════════════════════════════════════════════════ */
.form-group{ margin-bottom:18px; }
.form-label{
  display:block; font-size:11px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase;
  color:var(--text2); margin-bottom:7px;
}
.form-input{
  width:100%; background:var(--surface2); border:1.5px solid var(--border2);
  border-radius:10px; padding:13px 16px; font-size:15px;
  color:var(--text); font-family:'DM Sans',sans-serif;
  outline:none; transition:border-color 0.2s, box-shadow 0.2s;
  appearance:none; -webkit-appearance:none;
}
.form-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(74,222,128,0.1); }
.form-input:disabled{ opacity:0.5; cursor:not-allowed; }
.form-input.error{ border-color:var(--red); }
.form-input.success{ border-color:var(--green); }
.form-input::placeholder{ color:var(--text3); }
.field-note{
  font-size:11px; color:var(--text3); margin-top:6px;
}
.field-status{
  font-size:11px; margin-top:6px; min-height:16px;
  display:flex; align-items:center; gap:5px;
}
.field-status.ok{ color:var(--green); }
.field-status.err{ color:var(--red); }

/* Password wrapper */
.pw-wrap{ position:relative; }
.pw-wrap .form-input{ padding-right:46px; }
.pw-toggle{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; color:var(--text3);
  padding:4px; border-radius:5px; transition:color 0.15s;
}
.pw-toggle:hover{ color:var(--text2); }
.pw-toggle svg{ width:18px; height:18px; display:block; }

/* Password strength */
.pw-strength-wrap{ margin-top:8px; }
.pw-strength-bar{ display:flex; gap:4px; margin-bottom:4px; }
.pw-seg{ flex:1; height:3px; border-radius:2px; background:var(--border2); transition:background 0.25s; }
.pw-seg.s1{ background:#f87171; }
.pw-seg.s2{ background:#f97316; }
.pw-seg.s3{ background:#facc15; }
.pw-seg.s4{ background:#4ade80; }
.pw-strength-label{ font-size:10px; color:var(--text3); letter-spacing:0.5px; }

/* Buttons */
.btn-submit{
  width:100%; background:var(--accent); color:#000; border:none;
  border-radius:12px; padding:14px; font-size:15px; font-weight:700;
  font-family:'DM Sans',sans-serif; cursor:pointer;
  transition:opacity 0.15s, transform 0.1s; margin-top:4px;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-submit:hover{ opacity:0.9; }
.btn-submit:active{ transform:scale(0.98); }
.btn-submit:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
.btn-spinner{
  width:16px; height:16px; border:2px solid rgba(0,0,0,0.2);
  border-top-color:#000; border-radius:50%;
  animation:spin 0.6s linear infinite; display:none;
}
.btn-submit.loading .btn-spinner{ display:block; }
.btn-submit.loading .btn-text{ display:none; }
@keyframes spin{ to{transform:rotate(360deg);} }

/* Alert banners */
.form-alert{
  border-radius:10px; padding:12px 16px;
  font-size:13px; line-height:1.45; margin-bottom:18px; display:none;
}
.form-alert.show{ display:block; }
.form-alert.error{ background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.25); color:#f87171; }
.form-alert.success{ background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.25); color:#4ade80; }

/* Loading skeleton */
.skeleton{
  display:inline-block; background:var(--border2);
  border-radius:6px; animation:shimmer 1.4s infinite;
  height:1em; vertical-align:middle;
}
@keyframes shimmer{
  0%,100%{ opacity:0.4; }
  50%{ opacity:0.7; }
}

/* ═══ PERSONAL BESTS + HISTORY ════════════════════════════════════════════ */
.pb-row {
  display:flex; align-items:center; gap:12px;
  padding:10px 14px; border-radius:10px;
  background:var(--surface2); border:1px solid var(--border2);
}
.pb-game-badge {
  width:28px; height:28px; border-radius:7px; flex-shrink:0;
  font-family:'Bebas Neue',sans-serif; font-size:15px;
  display:flex; align-items:center; justify-content:center; font-weight:700;
}
.pb-game-name { flex:1; font-size:13px; font-weight:600; color:var(--text2); }
.pb-score { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1px; color:var(--text); }
.pb-played { font-size:11px; color:var(--text3); text-align:right; }
.hist-row {
  display:flex; align-items:center; gap:10px;
  padding:8px 14px; border-radius:10px;
  background:var(--surface2); border:1px solid var(--border2);
}
.hist-game-badge {
  width:24px; height:24px; border-radius:6px; flex-shrink:0;
  font-family:'Bebas Neue',sans-serif; font-size:13px;
  display:flex; align-items:center; justify-content:center;
}
.hist-game-name { flex:1; font-size:12px; color:var(--text2); }
.hist-score { font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:0.5px; color:var(--text); }
.hist-date { font-size:11px; color:var(--text3); }

/* ═══ RESPONSIVE ══════════════════════════════════════════════════════════ */
@media(max-width:767px){
  .hdr-inner{ padding:0 16px; grid-template-columns:auto 1fr auto; }
  .hdr-center{ display:none; }
  .ftr-inner{ flex-direction:column; align-items:flex-start; padding:0 16px; gap:14px; }
  .ftr-links{ gap:14px; flex-wrap:wrap; }
}
@media(max-width:600px){
  .page-wrap{ padding:24px 16px 60px; }
  .account-card{ padding:22px 18px; }
  .stats-row{ gap:8px; }
  .stat-num{ font-size:22px; }
  .profile-back{ padding:5px 12px; font-size:12px; }
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-radial"></div>

<!-- ═══ HEADER ══════════════════════════════════════════════════════════ -->
<header class="site-header">
  <div class="hdr-inner">

  </div>
</header>

<!-- ═══ MAIN ════════════════════════════════════════════════════════════ -->
<main class="page-wrap">
  <div class="account-wrap">

    <!-- Profile header -->
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar">??</div>
      <div class="profile-name-block">
        <div class="profile-username" id="profileUsername"><span class="skeleton" style="width:120px">&nbsp;</span></div>
        <div class="profile-meta" id="profileMeta"><span class="skeleton" style="width:160px">&nbsp;</span></div>
      </div>
      <a href="/index.html" class="profile-back">← Back to Games</a>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-pill">
        <span class="stat-num" id="statGames">—</span>
        <span class="stat-label">Games Played</span>
      </div>
      <div class="stat-pill">
        <span class="stat-num" id="statStreak">—</span>
        <span class="stat-label">Day Streak</span>
      </div>
      <div class="stat-pill">
        <span class="stat-num" id="statBest">—</span>
        <span class="stat-label">Best Streak</span>
      </div>
    </div>

    <!-- Two-column grid -->
    <div class="acct-grid">

      <!-- LEFT: per-game score archive -->
      <div class="game-stats-section" id="gameStatsSection">
        <!-- populated by JS -->
        <div class="gsc-card"><div class="gsc-empty">Loading game stats…</div></div>
      </div>

      <!-- RIGHT: account settings -->
      <div class="settings-col">

    <!-- Account Details card -->
    <div class="account-card">
      <div class="card-title">Account Details</div>
      <div class="form-alert" id="detailsAlert"></div>
      <form id="detailsForm" novalidate autocomplete="off">

        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" type="text" id="displayUsername" disabled placeholder="Loading…">
          <div class="field-note">Username cannot be changed</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="Loading…" autocomplete="email">
          <div class="field-status" id="emailStatus"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="country">Country</label>
          <select class="form-input" id="country" name="country">
            <option value="">Loading countries…</option>
          </select>
        </div>

        <button type="submit" class="btn-submit" id="detailsBtn">
          <span class="btn-text">Save Details</span>
          <div class="btn-spinner"></div>
        </button>
      </form>
    </div>

    <!-- Change Password card -->
    <div class="account-card">
      <div class="card-title">Change Password</div>
      <div class="form-alert" id="pwAlert"></div>
      <form id="pwForm" novalidate autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="currentPw">Current Password</label>
          <div class="pw-wrap">
            <input class="form-input" type="password" id="currentPw" name="currentPw" placeholder="Your current password" autocomplete="current-password">
            <button type="button" class="pw-toggle" id="toggleCurrent" aria-label="Show/hide">
              <svg id="eyeC1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeC2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="newPw">New Password</label>
          <div class="pw-wrap">
            <input class="form-input" type="password" id="newPw" name="newPw" placeholder="At least 8 characters" autocomplete="new-password">
            <button type="button" class="pw-toggle" id="toggleNew" aria-label="Show/hide">
              <svg id="eyeN1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeN2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="pw-strength-wrap" id="pwStrengthWrap" style="display:none">
            <div class="pw-strength-bar">
              <div class="pw-seg" id="seg1"></div>
              <div class="pw-seg" id="seg2"></div>
              <div class="pw-seg" id="seg3"></div>
              <div class="pw-seg" id="seg4"></div>
            </div>
            <div class="pw-strength-label" id="pwStrengthLabel"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPw">Confirm New Password</label>
          <input class="form-input" type="password" id="confirmPw" name="confirmPw" placeholder="Repeat new password" autocomplete="new-password">
          <div class="field-status" id="confirmStatus"></div>
        </div>

        <button type="submit" class="btn-submit" id="pwBtn">
          <span class="btn-text">Update Password</span>
          <div class="btn-spinner"></div>
        </button>
      </form>
    </div><!-- /.account-card change-pw -->

      </div><!-- /.settings-col -->
    </div><!-- /.acct-grid -->

  </div><!-- /.account-wrap -->
</main>

<!-- ═══ FOOTER ══════════════════════════════════════════════════════════ -->
<footer class="site-footer" role="contentinfo">
  <div class="ftr-inner">
    <div class="ftr-logo">CLICK<span>ZLE</span></div>
    <div class="ftr-links">
      <a href="/about.html" class="ftr-link">About</a>
      <a href="/contact.html" class="ftr-link">Contact</a>
      <a href="/privacy.html" class="ftr-link">Privacy</a>
      <a href="/terms.html" class="ftr-link">Terms of Use</a>
    </div>
    <div class="ftr-copy">&copy; 2026 Clickzle. All rights reserved.</div>
  </div>
</footer>

<script>
(function(){
  'use strict';

  // ── Reset timer ───────────────────────────────────────────────────────────
  (function(){
    var el = document.getElementById('hdrTimer');
    if (!el) return;
    function tick(){
      var now = new Date();
      var s = (23 - now.getUTCHours()) * 3600 + (59 - now.getUTCMinutes()) * 60 + (59 - now.getUTCSeconds());
      el.textContent = [Math.floor(s/3600), Math.floor((s%3600)/60), s%60]
        .map(function(n){ return String(n).padStart(2,'0'); }).join(':');
    }
    tick(); setInterval(tick, 1000);
  })();

  // ── Theme ─────────────────────────────────────────────────────────────────
  const theme = localStorage.getItem('cz_theme') || 'dark';
  if (theme === 'light') document.body.classList.add('light');
  document.getElementById('themeToggle').addEventListener('click', function(){
    document.body.classList.toggle('light');
    const t = document.body.classList.contains('light') ? 'light' : 'dark';
    localStorage.setItem('cz_theme', t);
    document.getElementById('iconSun').style.display  = t === 'dark'  ? '' : 'none';
    document.getElementById('iconMoon').style.display = t === 'light' ? '' : 'none';
  });
  if (theme === 'light') {
    document.getElementById('iconSun').style.display  = 'none';
    document.getElementById('iconMoon').style.display = '';
  }

  // ── Country select population ─────────────────────────────────────────────
  var countrySelect = document.getElementById('country');
  var countriesLoaded = false;
  function loadCountries(preselect) {
    fetch('https://restcountries.com/v3.1/all?fields=name,cca2')
      .then(function(r){ return r.json(); })
      .then(function(data){
        data.sort(function(a,b){ return a.name.common.localeCompare(b.name.common); });
        countrySelect.innerHTML = '<option value="">Select your country\u2026</option>';
        data.forEach(function(c){
          var o = document.createElement('option');
          o.value = c.cca2.toLowerCase();
          o.textContent = c.name.common;
          if (preselect && o.value === preselect) o.selected = true;
          countrySelect.appendChild(o);
        });
        countriesLoaded = true;
      })
      .catch(function(){ countrySelect.innerHTML = '<option value="">Could not load countries</option>'; });
  }

  // ── Load profile data ─────────────────────────────────────────────────────
  function formatDate(unixSec) {
    if (!unixSec) return '';
    const d = new Date(unixSec * 1000);
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  }

  function populateProfile(user, me) {
    const initials = (user.username || '??').slice(0, 2).toUpperCase();
    document.getElementById('profileAvatar').textContent   = initials;
    document.getElementById('profileUsername').textContent = user.username || '';
    document.getElementById('profileMeta').textContent     = me ? 'Member since ' + formatDate(me.user.created_at) : '';
    document.getElementById('displayUsername').value       = user.username || '';
    document.getElementById('email').value                 = (me ? me.user.email : user.email) || '';

    if (me) {
      document.getElementById('statGames').textContent  = me.user.total_games  || 0;
      document.getElementById('statStreak').textContent = me.user.streak_days  || 0;
      document.getElementById('statBest').textContent   = me.user.best_streak  || 0;
    }

    const countryCode = me ? (me.user.country || '') : '';
    if (countriesLoaded) {
      countrySelect.value = countryCode;
    } else {
      loadCountries(countryCode);
    }
  }

  // Start with local data immediately
  const localUser = CZAuth.getUser();
  if (localUser) {
    document.getElementById('profileAvatar').textContent   = localUser.username.slice(0,2).toUpperCase();
    document.getElementById('profileUsername').textContent = localUser.username;
    document.getElementById('displayUsername').value       = localUser.username;
    document.getElementById('email').value                 = localUser.email || '';
    loadCountries('');
  }

  // Game metadata
  const GAMES = {
    game1: { name:'Complete the Image', color:'#4ade80', bg:'rgba(74,222,128,0.12)' },
    game2: { name:'Follow the Pattern', color:'#60a5fa', bg:'rgba(96,165,250,0.12)' },
    game3: { name:'Hit the Target',     color:'#f472b6', bg:'rgba(244,114,182,0.12)' },
    game4: { name:'Spot the Pair',      color:'#facc15', bg:'rgba(250,204,21,0.12)' },
    game5: { name:'Next in Sequence',   color:'#a78bfa', bg:'rgba(167,139,250,0.12)' },
  };
  function gameNum(id) { return id ? id.replace('game','') : '?'; }

  function fmtDate(unixSec) {
    if (!unixSec) return '';
    const d = new Date(unixSec * 1000);
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }
  function fmtTime(unixSec) {
    if (!unixSec) return '';
    const d = new Date(unixSec * 1000);
    return d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  }
  function dateFromScore(s) {
    // prefer submitted_at (unix), fall back to date_utc string
    if (s.submitted_at) return s.submitted_at;
    if (s.date_utc) { const ts = Date.parse(s.date_utc); return isNaN(ts) ? 0 : ts / 1000; }
    return 0;
  }

  function renderGameStats(pbs, recentScores) {
    const section = document.getElementById('gameStatsSection');
    if (!section) return;

    // Build pb lookup — DB stores game_id as integer (1,2,3…), prefix to match GAMES keys
    const pbMap = {};
    (pbs || []).forEach(function(pb){ pbMap['game' + pb.game_id] = pb; });

    // Game 1 categories use game_ids 11-18 — aggregate them into 'game1'
    const G1_IDS = [11,12,13,14,15,16,17,18];
    const g1Pbs = G1_IDS.map(function(id){ return pbMap['game' + id]; }).filter(Boolean);
    if (g1Pbs.length) {
      pbMap['game1'] = {
        best_score:   Math.max.apply(null, g1Pbs.map(function(p){ return p.best_score || 0; })),
        games_played: g1Pbs.reduce(function(s, p){ return s + (p.games_played || 0); }, 0)
      };
    }

    // Group recent scores by game, sort each group by score desc, take top 5
    const byGame = {};
    (recentScores || []).forEach(function(s){
      // Map Game 1 category ids (11-18) to 'game1'
      const key = G1_IDS.indexOf(s.game_id) !== -1 ? 'game1' : 'game' + s.game_id;
      if (!byGame[key]) byGame[key] = [];
      byGame[key].push(s);
    });
    Object.keys(byGame).forEach(function(gid){
      byGame[gid].sort(function(a,b){ return (b.score||0) - (a.score||0); });
      byGame[gid] = byGame[gid].slice(0, 5);
    });

    // Render a card per game (show all 5 games, even if no data yet)
    const gameOrder = ['game1','game2','game3','game4','game5'];
    const hasAnyData = pbs && pbs.length;

    if (!hasAnyData) {
      section.innerHTML = '<div class="gsc-card"><div class="gsc-empty">Play a game to see your stats here.</div></div>';
      return;
    }

    section.innerHTML = gameOrder.map(function(gid) {
      const g    = GAMES[gid];
      const pb   = pbMap[gid];
      const rows = byGame[gid] || [];
      if (!pb && !rows.length) return ''; // never played this game

      const bestScore = pb ? (pb.best_score || 0) : 0;
      const plays     = pb ? (pb.games_played || 0) : 0;

      const rowsHtml = rows.length ? rows.map(function(s, i) {
        const ts   = dateFromScore(s);
        const date = ts ? fmtDate(ts) : (s.date_utc || '');
        const time = ts ? fmtTime(ts) : '';
        const isTop = i === 0;
        return `<div class="gsc-row">
          <div class="gsc-rank${isTop ? ' top' : ''}">${i+1}</div>
          <div class="gsc-score-val" style="color:${g.color};">${(s.score||0).toLocaleString()}</div>
          <div class="gsc-date">${date}</div>
          <div class="gsc-time">${time}</div>
        </div>`;
      }).join('') : `<div class="gsc-empty">No detailed records yet.</div>`;

      return `<div class="gsc-card">
        <div class="gsc-header">
          <div class="gsc-badge" style="background:${g.bg};color:${g.color};">${gameNum(gid)}</div>
          <div class="gsc-game-name" style="color:${g.color};">${g.name}</div>
          ${bestScore ? `<div class="gsc-best-tag" style="background:${g.bg};color:${g.color};">Best: ${bestScore.toLocaleString()}</div>` : ''}
          <div class="gsc-plays">${plays} play${plays !== 1 ? 's' : ''}</div>
        </div>
        <div class="gsc-score-table">${rowsHtml}</div>
      </div>`;
    }).filter(Boolean).join('');

    if (!section.innerHTML) {
      section.innerHTML = '<div class="gsc-card"><div class="gsc-empty">Play a game to see your stats here.</div></div>';
    }
  }

  // Then fetch full profile from API
  CZAuth.apiFetch('/api/auth/me').then(function(me){
    if (me && me.ok) {
      populateProfile(localUser || {}, me);
      renderGameStats(me.personal_bests, me.recent_scores);
    }
  }).catch(function(){});

  // ── Helpers ───────────────────────────────────────────────────────────────
  function showAlert(id, msg, type) {
    var el = document.getElementById(id);
    el.textContent = msg;
    el.className   = 'form-alert show ' + type;
  }
  function hideAlert(id) {
    document.getElementById(id).className = 'form-alert';
  }
  function setStatus(id, ok, msg) {
    var el = document.getElementById(id);
    if (!msg) { el.className = 'field-status'; el.innerHTML = ''; return; }
    el.className = 'field-status ' + (ok ? 'ok' : 'err');
    el.innerHTML = ok
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>' + msg
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' + msg;
  }
  function setLoading(btnId, on) {
    var btn = document.getElementById(btnId);
    btn.disabled = on;
    if (on) btn.classList.add('loading'); else btn.classList.remove('loading');
  }

  // ── Email live check ──────────────────────────────────────────────────────
  var emTimer = null;
  document.getElementById('email').addEventListener('input', function(){
    var v = this.value.trim();
    clearTimeout(emTimer);
    if (!v) { setStatus('emailStatus', false, ''); this.classList.remove('error','success'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
      setStatus('emailStatus', false, 'Enter a valid email');
      this.classList.add('error'); this.classList.remove('success'); return;
    }
    this.classList.remove('error','success');
    setStatus('emailStatus', true, 'Checking…');
    emTimer = setTimeout(function(){
      CZAuth.apiFetch('/api/auth/check-email?e=' + encodeURIComponent(v))
        .then(function(data){
          if (data.available) {
            setStatus('emailStatus', true, 'Email available');
            document.getElementById('email').classList.add('success');
          } else {
            // May be their own email — not an error, just info
            setStatus('emailStatus', false, '');
          }
        }).catch(function(){ setStatus('emailStatus', false, ''); });
    }, 600);
  });

  // ── Details form ──────────────────────────────────────────────────────────
  document.getElementById('detailsForm').addEventListener('submit', async function(e){
    e.preventDefault();
    hideAlert('detailsAlert');

    var email   = document.getElementById('email').value.trim();
    var country = document.getElementById('country').value || null;

    if (!email) { showAlert('detailsAlert','Please enter your email address','error'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('detailsAlert','Please enter a valid email address','error'); return; }

    setLoading('detailsBtn', true);
    try {
      var res = await CZAuth.updateAccount({ email: email, country: country });
      if (res.ok) {
        showAlert('detailsAlert', 'Details saved successfully!', 'success');
      } else {
        showAlert('detailsAlert', res.error || 'Something went wrong. Please try again.', 'error');
      }
    } catch(err) {
      showAlert('detailsAlert', 'Network error — please try again.', 'error');
    }
    setLoading('detailsBtn', false);
  });

  // ── Password toggles ──────────────────────────────────────────────────────
  function initToggle(inputId, btnId, e1, e2) {
    document.getElementById(btnId).addEventListener('click', function(){
      var inp = document.getElementById(inputId);
      var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      document.getElementById(e1).style.display = show ? 'none' : '';
      document.getElementById(e2).style.display = show ? '' : 'none';
    });
  }
  initToggle('currentPw', 'toggleCurrent', 'eyeC1', 'eyeC2');
  initToggle('newPw',     'toggleNew',     'eyeN1', 'eyeN2');

  // ── Password strength ─────────────────────────────────────────────────────
  var segs      = [1,2,3,4].map(function(i){ return document.getElementById('seg'+i); });
  var pwLabel   = document.getElementById('pwStrengthLabel');
  var pwWrap    = document.getElementById('pwStrengthWrap');
  var strengths = ['','Weak','Fair','Good','Strong'];
  function scorePassword(pw) {
    var s = 0;
    if (pw.length >= 8)  s++;
    if (pw.length >= 12) s++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++;
    if (/\d/.test(pw))   s++;
    if (/[^a-zA-Z0-9]/.test(pw)) s++;
    return Math.min(4, Math.max(0, Math.ceil(s * 0.9)));
  }
  document.getElementById('newPw').addEventListener('input', function(){
    var pw = this.value;
    if (!pw) { pwWrap.style.display = 'none'; return; }
    pwWrap.style.display = '';
    var score = scorePassword(pw);
    segs.forEach(function(seg, i){
      seg.className = 'pw-seg';
      if (i < score) seg.classList.add('s' + score);
    });
    pwLabel.textContent = pw.length < 8 ? 'Too short' : strengths[score];
    checkConfirm();
  });

  // ── Confirm match ─────────────────────────────────────────────────────────
  function checkConfirm() {
    var nv = document.getElementById('newPw').value;
    var cv = document.getElementById('confirmPw').value;
    if (!cv) { setStatus('confirmStatus', false, ''); return; }
    if (nv === cv) setStatus('confirmStatus', true, 'Passwords match');
    else           setStatus('confirmStatus', false, 'Passwords do not match');
  }
  document.getElementById('confirmPw').addEventListener('input', checkConfirm);

  // ── Password form ─────────────────────────────────────────────────────────
  document.getElementById('pwForm').addEventListener('submit', async function(e){
    e.preventDefault();
    hideAlert('pwAlert');

    var currentPw = document.getElementById('currentPw').value;
    var newPw     = document.getElementById('newPw').value;
    var confirmPw = document.getElementById('confirmPw').value;

    if (!currentPw) { showAlert('pwAlert','Please enter your current password','error'); return; }
    if (!newPw || newPw.length < 8) { showAlert('pwAlert','New password must be at least 8 characters','error'); return; }
    if (newPw !== confirmPw) { showAlert('pwAlert','New passwords do not match','error'); return; }

    setLoading('pwBtn', true);
    try {
      var res = await CZAuth.updateAccount({ current_password: currentPw, new_password: newPw });
      if (res.ok) {
        showAlert('pwAlert', 'Password updated successfully!', 'success');
        document.getElementById('pwForm').reset();
        pwWrap.style.display = 'none';
        setStatus('confirmStatus', false, '');
      } else {
        showAlert('pwAlert', res.error || 'Something went wrong. Please try again.', 'error');
      }
    } catch(err) {
      showAlert('pwAlert', 'Network error — please try again.', 'error');
    }
    setLoading('pwBtn', false);
  });

})();
</script>
