<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Google tag (gtag.js) -->

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-LVM484NRCG');

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Clickzle</title>
<meta name="description" content="Set a new password for your Clickzle account.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="/assets/js/auth.js"></script>
<style>

/* ═══ TOKENS ══════════════════════════════════════════════════════════════ */
:root {
  --bg:#0a0a0a; --surface:#141414; --surface2:#1e1e1e;
  --border:#222; --border2:#2e2e2e;
  --text:#f0f0f0; --text2:#b0b0b0; --text3:#888;
  --accent:#4ade80;
  --accent-dim:rgba(74,222,128,0.08);
  --accent-border:rgba(74,222,128,0.22);
  --green:#4ade80; --red:#f87171;
}
body.light {
  --bg:#f4f4f4; --surface:#fff; --surface2:#ebebeb;
  --border:#d0d0d0; --border2:#c0c0c0;
  --text:#111; --text2:#444; --text3:#777;
  --accent-dim:rgba(74,222,128,0.12);
  --accent-border:rgba(74,222,128,0.28);
}

/* ═══ RESET ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden;
}

/* ═══ BACKGROUND ══════════════════════════════════════════════════════════ */
.bg-grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
  background-size:72px 72px;
}
.bg-radial{
  position:fixed; top:-200px; left:50%; transform:translateX(-50%);
  width:800px; height:500px;
  background:radial-gradient(ellipse, rgba(74,222,128,0.07) 0%, transparent 68%);
  pointer-events:none; z-index:0;
}
body.light .bg-grid{display:none;}
body.light .bg-radial{opacity:0.2;}

/* ═══ HEADER ══════════════════════════════════════════════════════════════ */
.site-header{
  position:sticky; top:0; z-index:100;
  background:rgba(10,10,10,0.88); backdrop-filter:blur(18px);
}
.site-header::after{
  content:""; position:absolute; bottom:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(74,222,128,0.15) 20%,rgba(74,222,128,0.9) 50%,rgba(74,222,128,0.15) 80%,transparent 100%);
}
body.light .site-header{background:rgba(244,244,244,0.92);}
.hdr-inner{
  max-width:1120px; margin:0 auto; padding:0 28px; height:62px;
  display:flex; align-items:center; justify-content:space-between;
}
.site-logo{
  font-family:'Bebas Neue',sans-serif; font-size:26px;
  letter-spacing:3px; color:var(--text); text-decoration:none;
}
.site-logo span{color:var(--accent);}
.hdr-right{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;cursor:pointer;color:var(--text2);
  border-radius:8px;transition:background 0.15s,color 0.15s;
}
.icon-btn:hover{background:var(--surface2);color:var(--text);}
.icon-btn svg{width:18px;height:18px;}

/* ═══ PAGE LAYOUT ═════════════════════════════════════════════════════════ */
.page-wrap{
  position:relative; z-index:1;
  min-height:calc(100vh - 62px);
  display:flex; align-items:center; justify-content:center;
  padding:40px 20px 60px;
}

/* ═══ AUTH CARD ═══════════════════════════════════════════════════════════ */
.auth-card{
  background:var(--surface); border:1px solid var(--border2);
  border-radius:20px; padding:40px 36px;
  width:100%; max-width:420px;
}
.auth-logo-wrap{text-align:center;margin-bottom:28px;}
.auth-logo{
  font-family:'Bebas Neue',sans-serif; font-size:32px;
  letter-spacing:4px; color:var(--text); text-decoration:none;
  display:inline-block;
}
.auth-logo span{color:var(--accent);}
.auth-card-title{
  font-family:'Bebas Neue',sans-serif; font-size:28px;
  letter-spacing:2px; color:var(--text); margin-bottom:6px;
}
.auth-card-sub{font-size:13px;color:var(--text2);margin-bottom:28px;line-height:1.5;}

/* ═══ FORM FIELDS ═════════════════════════════════════════════════════════ */
.form-group{margin-bottom:18px;}
.form-label{
  display:block; font-size:11px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase;
  color:var(--text2); margin-bottom:7px;
}
.form-input{
  width:100%; background:var(--surface2); border:1.5px solid var(--border2);
  border-radius:10px; padding:13px 16px; font-size:15px;
  color:var(--text); font-family:'DM Sans',sans-serif;
  outline:none; transition:border-color 0.2s, box-shadow 0.2s;
}
.form-input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(74,222,128,0.1);}
.form-input.error{border-color:var(--red);}
.form-input::placeholder{color:var(--text3);}

/* Password wrapper */
.pw-wrap{position:relative;}
.pw-wrap .form-input{padding-right:46px;}
.pw-toggle{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; color:var(--text3);
  padding:4px; border-radius:5px; transition:color 0.15s;
}
.pw-toggle:hover{color:var(--text2);}
.pw-toggle svg{width:18px;height:18px;display:block;}

/* Password strength */
.pw-strength-wrap{margin-top:8px;}
.pw-strength-bar{display:flex;gap:4px;margin-bottom:4px;}
.pw-seg{flex:1;height:3px;border-radius:2px;background:var(--border2);transition:background 0.25s;}
.pw-seg.s1{background:#f87171;}
.pw-seg.s2{background:#f97316;}
.pw-seg.s3{background:#facc15;}
.pw-seg.s4{background:#4ade80;}
.pw-strength-label{font-size:10px;color:var(--text3);letter-spacing:0.5px;}

/* Submit button */
.btn-submit{
  width:100%; background:var(--accent); color:#000; border:none;
  border-radius:12px; padding:15px; font-size:15px; font-weight:700;
  font-family:'DM Sans',sans-serif; cursor:pointer;
  letter-spacing:0.3px; transition:opacity 0.15s, transform 0.1s;
  margin-top:4px; display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-submit:hover{opacity:0.9;}
.btn-submit:active{transform:scale(0.98);}
.btn-submit:disabled{opacity:0.45;cursor:not-allowed;transform:none;}
.btn-spinner{
  width:16px;height:16px;border:2px solid rgba(0,0,0,0.2);
  border-top-color:#000;border-radius:50%;
  animation:spin 0.6s linear infinite;display:none;
}
.btn-submit.loading .btn-spinner{display:block;}
.btn-submit.loading .btn-text{display:none;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Alert */
.form-alert{
  border-radius:10px; padding:12px 16px;
  font-size:13px; line-height:1.45; margin-bottom:20px;
  display:none;
}
.form-alert.show{display:block;}
.form-alert.error{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.25);color:#f87171;}
.form-alert.success{background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.25);color:#4ade80;}

/* Invalid token card */
.invalid-card{
  text-align:center;
}
.invalid-icon{
  width:64px; height:64px; border-radius:50%;
  background:rgba(248,113,113,0.1); border:2px solid rgba(248,113,113,0.3);
  display:flex; align-items:center; justify-content:center;
  font-size:28px; margin:0 auto 20px;
}
.invalid-title{
  font-family:'Bebas Neue',sans-serif; font-size:28px;
  letter-spacing:2px; color:var(--text); margin-bottom:10px;
}
.invalid-body{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:28px;}
.btn-link{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--accent); color:#000; border:none;
  border-radius:12px; padding:13px 28px;
  font-size:14px; font-weight:700; font-family:'DM Sans',sans-serif;
  cursor:pointer; text-decoration:none;
  transition:opacity 0.15s;
}
.btn-link:hover{opacity:0.88;}

@media(max-width:480px){
  .hdr-inner{padding:0 16px;}
  .auth-card{padding:28px 22px;border-radius:16px;}
  .page-wrap{padding:24px 16px 48px;}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-radial"></div>

<!-- ═══ HEADER ══════════════════════════════════════════════════════════ -->
<header class="site-header">
  <div class="hdr-inner">
    <a href="/index.html" class="site-logo">CLICK<span>ZLE</span></a>
    <div class="hdr-right">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ═══ MAIN ════════════════════════════════════════════════════════════ -->
<main class="page-wrap">
  <div class="auth-card">

    <div class="auth-logo-wrap">
      <a href="/index.html" class="auth-logo">CLICK<span>ZLE</span></a>
    </div>

    <!-- Invalid / expired token -->
    <div id="invalidState" style="display:none;" class="invalid-card">
      <div class="invalid-icon">✕</div>
      <div class="invalid-title">Link Expired</div>
      <p class="invalid-body">This password reset link has expired or already been used. Reset links are valid for 1 hour.</p>
      <a href="/login.html" class="btn-link">Back to Login →</a>
    </div>

    <!-- Reset form (shown when token is present) -->
    <div id="resetForm">
      <div class="auth-card-title">New Password</div>
      <p class="auth-card-sub">Choose a strong password for your account.</p>

      <div class="form-alert" id="formAlert"></div>

      <form id="pwForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <div class="pw-wrap">
            <input class="form-input" type="password" id="password" name="password"
              placeholder="At least 8 characters" autocomplete="new-password">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show/hide password">
              <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="pw-strength-wrap" id="pwStrengthWrap" style="display:none">
            <div class="pw-strength-bar">
              <div class="pw-seg" id="seg1"></div>
              <div class="pw-seg" id="seg2"></div>
              <div class="pw-seg" id="seg3"></div>
              <div class="pw-seg" id="seg4"></div>
            </div>
            <div class="pw-strength-label" id="pwStrengthLabel"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm">Confirm Password</label>
          <input class="form-input" type="password" id="confirm" name="confirm"
            placeholder="Repeat your new password" autocomplete="new-password">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">Set New Password</span>
          <div class="btn-spinner"></div>
        </button>

      </form>
    </div>

  </div>
</main>

<script>
(function(){
  // ── Theme ─────────────────────────────────────────────────────────────────
  const theme = localStorage.getItem('cz_theme') || 'dark';
  if(theme==='light') document.body.classList.add('light');
  document.getElementById('themeToggle').addEventListener('click',()=>{
    document.body.classList.toggle('light');
    const t = document.body.classList.contains('light') ? 'light' : 'dark';
    localStorage.setItem('cz_theme', t);
    document.getElementById('iconSun').style.display  = t==='dark'  ? '' : 'none';
    document.getElementById('iconMoon').style.display = t==='light' ? '' : 'none';
  });
  if(theme==='light'){
    document.getElementById('iconSun').style.display  = 'none';
    document.getElementById('iconMoon').style.display = '';
  }

  // ── Check token in URL ────────────────────────────────────────────────────
  const token = new URLSearchParams(window.location.search).get('token');
  if(!token) {
    document.getElementById('resetForm').style.display    = 'none';
    document.getElementById('invalidState').style.display = '';
  }

  // ── Password toggle ──────────────────────────────────────────────────────
  const pwInput   = document.getElementById('password');
  const pwToggle  = document.getElementById('pwToggle');
  const eyeOpen   = document.getElementById('eyeOpen');
  const eyeClosed = document.getElementById('eyeClosed');
  pwToggle.addEventListener('click',()=>{
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    eyeOpen.style.display   = show ? 'none' : '';
    eyeClosed.style.display = show ? '' : 'none';
  });

  // ── Password strength ─────────────────────────────────────────────────────
  const segs      = [1,2,3,4].map(i => document.getElementById('seg'+i));
  const pwLabel   = document.getElementById('pwStrengthLabel');
  const pwWrap    = document.getElementById('pwStrengthWrap');
  const strengths = ['','Weak','Fair','Good','Strong'];
  function scorePassword(pw){
    let s=0;
    if(pw.length>=8)  s++;
    if(pw.length>=12) s++;
    if(/[A-Z]/.test(pw)&&/[a-z]/.test(pw)) s++;
    if(/\d/.test(pw)) s++;
    if(/[^a-zA-Z0-9]/.test(pw)) s++;
    return Math.min(4,Math.max(0,Math.ceil(s*0.9)));
  }
  pwInput.addEventListener('input',()=>{
    const pw = pwInput.value;
    if(!pw){ pwWrap.style.display='none'; return; }
    pwWrap.style.display='';
    const score = scorePassword(pw);
    segs.forEach((seg,i)=>{
      seg.className='pw-seg';
      if(i<score) seg.classList.add('s'+score);
    });
    pwLabel.textContent = pw.length<8 ? 'Too short' : strengths[score];
  });

  // ── Alert helper ──────────────────────────────────────────────────────────
  const formAlert = document.getElementById('formAlert');
  function showAlert(msg, type='error'){
    formAlert.innerHTML = msg;
    formAlert.className = 'form-alert show ' + type;
    formAlert.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function hideAlert(){ formAlert.className='form-alert'; }

  // ── Shake animation ───────────────────────────────────────────────────────
  const shakeStyle = document.createElement('style');
  shakeStyle.textContent = '@keyframes cardShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(3px)}75%{transform:translateX(-1px)}}';
  document.head.appendChild(shakeStyle);
  function shakeCard(){
    const card = document.querySelector('.auth-card');
    card.style.animation='none';
    card.offsetHeight;
    card.style.animation='cardShake 0.38s ease-out';
  }

  // ── Form submit ───────────────────────────────────────────────────────────
  const submitBtn = document.getElementById('submitBtn');

  document.getElementById('pwForm').addEventListener('submit', async(e)=>{
    e.preventDefault();
    hideAlert();

    const password = pwInput.value;
    const confirm  = document.getElementById('confirm').value;

    if(!password || password.length < 8){
      showAlert('Password must be at least 8 characters.'); shakeCard(); return;
    }
    if(password !== confirm){
      showAlert('Passwords don\'t match.'); shakeCard();
      document.getElementById('confirm').focus();
      return;
    }

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;

    const result = await CZAuth.resetPassword(token, password);

    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;

    if(result && result.ok){
      showAlert('Password updated! Redirecting to login…', 'success');
      document.getElementById('pwForm').style.pointerEvents = 'none';
      setTimeout(()=>{ window.location.href='/login.html'; }, 1500);
    } else {
      const msg = (result && result.error) || 'This reset link has expired. Please request a new one.';
      if(msg.toLowerCase().includes('expired') || msg.toLowerCase().includes('invalid')){
        // Show the invalid state
        document.getElementById('resetForm').style.display    = 'none';
        document.getElementById('invalidState').style.display = '';
      } else {
        showAlert(msg); shakeCard();
      }
    }
  });
})();
</script>
</body>
</html>
