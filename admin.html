<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clickzle Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0a0a0f;
      --surface:  #13131a;
      --surface2: #1c1c26;
      --border:   rgba(255,255,255,0.08);
      --border2:  rgba(255,255,255,0.12);
      --text:     #f0f0f5;
      --text2:    #9090a8;
      --text3:    #5a5a70;
      --green:    #4ade80;
      --red:      #f87171;
      --yellow:   #facc15;
      --blue:     #60a5fa;
      --accent:   #f472b6;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; min-height: 100vh; padding: 24px 16px; }
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bebas+Neue&display=swap');

    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 4px; color: var(--accent); }
    .header p { font-size: 13px; color: var(--text3); margin-top: 4px; }

    .card { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 24px; max-width: 700px; margin: 0 auto 20px; }
    .card h2 { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 16px; }

    .field-row { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type="text"], input[type="password"] {
      flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--border2); border-radius: 9px;
      color: var(--text); font-size: 14px; padding: 10px 14px; outline: none; font-family: inherit;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--accent); color: #000; border: none; border-radius: 9px; padding: 10px 22px;
      font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    button:hover { opacity: 0.88; }
    button.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
    button.danger { background: var(--red); color: #000; }
    button.success { background: var(--green); color: #000; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
      border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .verified   { background: rgba(74,222,128,0.15); color: var(--green); border: 1px solid rgba(74,222,128,0.3); }
    .unverified { background: rgba(248,113,113,0.15); color: var(--red);   border: 1px solid rgba(248,113,113,0.3); }

    .user-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .user-field { background: var(--surface2); border-radius: 9px; padding: 10px 14px; }
    .user-field .lbl { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); font-weight: 600; margin-bottom: 3px; }
    .user-field .val { font-size: 14px; font-weight: 600; word-break: break-all; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text2); }
    td:first-child { color: var(--text); font-weight: 500; }
    tr:last-child td { border-bottom: none; }

    .game-label { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; display: inline-block; }
    .action-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .msg { padding: 10px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; margin-top: 12px; }
    .msg.ok  { background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }
    .msg.err { background: rgba(248,113,113,0.12); color: var(--red);   border: 1px solid rgba(248,113,113,0.25); }
    #results { display: none; }
    .empty { color: var(--text3); font-size: 13px; padding: 12px 0; }

    @media (max-width: 480px) { .user-grid { grid-template-columns: 1fr; } .field-row { flex-direction: column; } }
  </style>
</head>
<body>

<div class="header">
  <h1>Clickzle Admin</h1>
  <p>Player lookup &amp; management</p>
</div>

<!-- Auth -->
<div class="card" id="authCard">
  <h2>Admin Key</h2>
  <div class="field-row">
    <input type="password" id="adminKey" placeholder="Enter admin key…" autocomplete="off">
    <button onclick="saveKey()">Unlock</button>
  </div>
  <div id="authMsg"></div>
</div>

<!-- Lookup -->
<div class="card" id="lookupCard" style="display:none">
  <h2>Look Up Player</h2>
  <div class="field-row">
    <input type="text" id="searchVal" placeholder="Email address or username…" autocomplete="off">
    <button onclick="lookup()">Search</button>
  </div>
  <div id="lookupMsg"></div>
</div>

<!-- Results -->
<div id="results">
  <!-- User Info -->
  <div class="card">
    <h2>Player Info</h2>
    <div class="user-grid" id="userGrid"></div>
    <div class="action-row" id="actionRow"></div>
    <div id="actionMsg"></div>
  </div>

  <!-- Scores -->
  <div class="card">
    <h2>Scores (<span id="scoreCount">0</span>)</h2>
    <div id="scoresWrap"></div>
  </div>

  <!-- Personal Bests -->
  <div class="card">
    <h2>Personal Bests</h2>
    <div id="pbsWrap"></div>
  </div>
</div>

<script>
const API = 'https://clickzle-auth.thecontentcreationguy.workers.dev';

const GAME_NAMES = {
  1:'Complete the Image',2:'Follow the Pattern',3:'Hit the Target',
  4:'Spot the Pair',5:'Next in Sequence',
  11:'CTI – Movies',12:'CTI – Animals',13:'CTI – Art',14:'CTI – Flags',
  15:'CTI – Food',16:'CTI – Landscapes',17:'CTI – Buildings',18:'CTI – Celebrities',
};
const GAME_COLORS = {
  1:'#4ade80',2:'#60a5fa',3:'#f472b6',4:'#facc15',5:'#a78bfa',
  11:'#4ade80',12:'#4ade80',13:'#4ade80',14:'#4ade80',
  15:'#4ade80',16:'#4ade80',17:'#4ade80',18:'#4ade80',
};

let adminKey = localStorage.getItem('czAdminKey') || '';
let currentUser = null;

function saveKey() {
  const k = document.getElementById('adminKey').value.trim();
  if (!k) return;
  adminKey = k;
  localStorage.setItem('czAdminKey', k);
  document.getElementById('authCard').style.display = 'none';
  document.getElementById('lookupCard').style.display = '';
}

// If key already stored, skip auth card
if (adminKey) {
  document.getElementById('authCard').style.display = 'none';
  document.getElementById('lookupCard').style.display = '';
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey, ...(opts.headers || {}) },
  });
  return res.json();
}

function setMsg(id, text, type) {
  const el = document.getElementById(id);
  el.className = 'msg ' + type;
  el.textContent = text;
  el.style.display = text ? '' : 'none';
}

function fmtDate(ts) {
  if (!ts) return '—';
  if (String(ts).length === 10) ts = ts * 1000;
  return new Date(ts).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function fmtMs(ms) {
  if (!ms) return '—';
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return m > 0 ? `${m}m ${s % 60}s` : `${s}s`;
}

async function lookup() {
  const val = document.getElementById('searchVal').value.trim();
  if (!val) return;
  setMsg('lookupMsg', 'Searching…', 'ok');

  const isEmail = val.includes('@');
  const qs = isEmail ? `?email=${encodeURIComponent(val)}` : `?username=${encodeURIComponent(val)}`;
  const data = await apiFetch('/api/admin/lookup' + qs);

  if (data.error) {
    if (data.error === 'Unauthorised') {
      setMsg('lookupMsg', 'Wrong admin key — clear your browser storage and try again.', 'err');
      localStorage.removeItem('czAdminKey');
    } else {
      setMsg('lookupMsg', data.error, 'err');
    }
    return;
  }

  if (!data.found) { setMsg('lookupMsg', 'No player found with that email / username.', 'err'); return; }
  setMsg('lookupMsg', '', '');
  currentUser = data.user;
  renderUser(data.user, data.scores, data.personal_bests);
}

function renderUser(u, scores, pbs) {
  document.getElementById('results').style.display = '';

  // User grid
  const verified = u.email_verified === 1 || u.email_verified === true;
  const grid = document.getElementById('userGrid');
  grid.innerHTML = `
    <div class="user-field"><div class="lbl">Username</div><div class="val">${u.username}</div></div>
    <div class="user-field"><div class="lbl">Email</div><div class="val">${u.email}</div></div>
    <div class="user-field"><div class="lbl">Email Verified</div><div class="val">
      <span class="status-pill ${verified ? 'verified' : 'unverified'}">
        ${verified ? '✓ Verified' : '✗ Not verified'}
      </span>
    </div></div>
    <div class="user-field"><div class="lbl">Country</div><div class="val">${u.country || '—'}</div></div>
    <div class="user-field"><div class="lbl">Registered</div><div class="val">${fmtDate(u.created_at)}</div></div>
    <div class="user-field"><div class="lbl">Last Seen</div><div class="val">${fmtDate(u.last_seen)}</div></div>
    <div class="user-field"><div class="lbl">Streak / Best</div><div class="val">${u.streak_days || 0}d / ${u.best_streak || 0}d</div></div>
    <div class="user-field"><div class="lbl">Total Games</div><div class="val">${u.total_games || 0}</div></div>
    <div class="user-field" style="grid-column:1/-1"><div class="lbl">User ID</div><div class="val" style="font-size:11px;color:var(--text3)">${u.id}</div></div>
  `;

  // Actions
  const ar = document.getElementById('actionRow');
  ar.innerHTML = '';
  if (!verified) {
    const btn = document.createElement('button');
    btn.className = 'success';
    btn.textContent = '✓ Manually Verify Email';
    btn.onclick = () => manualVerify(u.id);
    ar.appendChild(btn);
  }
  const logBtn = document.createElement('button');
  logBtn.className = 'secondary';
  logBtn.textContent = 'Copy User ID';
  logBtn.onclick = () => { navigator.clipboard.writeText(u.id); logBtn.textContent = 'Copied!'; setTimeout(() => logBtn.textContent = 'Copy User ID', 2000); };
  ar.appendChild(logBtn);

  document.getElementById('actionMsg').innerHTML = '';

  // Scores
  document.getElementById('scoreCount').textContent = scores.length;
  const sw = document.getElementById('scoresWrap');
  if (!scores.length) { sw.innerHTML = '<div class="empty">No scores on record.</div>'; }
  else {
    sw.innerHTML = `<table>
      <thead><tr><th>Game</th><th>Date</th><th>Score</th><th>Time</th><th>Correct</th><th>Wrong</th><th>Submitted</th></tr></thead>
      <tbody>${scores.map(s => {
        const gname = GAME_NAMES[s.game_id] || 'Game ' + s.game_id;
        const gcol  = GAME_COLORS[s.game_id] || '#fff';
        return `<tr>
          <td><span class="game-label" style="background:${gcol}22;color:${gcol};border:1px solid ${gcol}44">${gname}</span></td>
          <td>${s.date_utc}</td>
          <td style="color:var(--text);font-weight:700">${(s.score||0).toLocaleString()}</td>
          <td>${fmtMs(s.time_ms)}</td>
          <td>${s.correct || 0}</td>
          <td>${s.wrong || 0}</td>
          <td>${fmtDate(s.submitted_at)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  }

  // Personal Bests
  const pw = document.getElementById('pbsWrap');
  if (!pbs.length) { pw.innerHTML = '<div class="empty">No personal bests on record.</div>'; }
  else {
    pw.innerHTML = `<table>
      <thead><tr><th>Game</th><th>Best Score</th><th>Best Date</th><th>Games Played</th></tr></thead>
      <tbody>${pbs.map(p => {
        const gname = GAME_NAMES[p.game_id] || 'Game ' + p.game_id;
        const gcol  = GAME_COLORS[p.game_id] || '#fff';
        return `<tr>
          <td><span class="game-label" style="background:${gcol}22;color:${gcol};border:1px solid ${gcol}44">${gname}</span></td>
          <td style="color:var(--text);font-weight:700">${(p.best_score||0).toLocaleString()}</td>
          <td>${p.best_date || '—'}</td>
          <td>${p.games_played || 0}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  }

  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function manualVerify(userId) {
  const data = await apiFetch('/api/admin/verify', {
    method: 'POST',
    body: JSON.stringify({ user_id: userId }),
  });
  const msg = document.getElementById('actionMsg');
  if (data.ok) {
    msg.className = 'msg ok';
    msg.textContent = '✓ Email verified successfully. The player can now log in and post scores.';
    // Update displayed status
    currentUser.email_verified = 1;
    renderUser(currentUser,
      JSON.parse(document.querySelector('#scoresWrap table') ? '[]' : '[]'),
      JSON.parse(document.querySelector('#pbsWrap table') ? '[]' : '[]')
    );
    lookup(); // re-fetch to refresh
  } else {
    msg.className = 'msg err';
    msg.textContent = data.error || 'Failed to verify.';
  }
}

// Enter key triggers search
document.getElementById('searchVal')?.addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
document.getElementById('adminKey')?.addEventListener('keydown', e => { if (e.key === 'Enter') saveKey(); });
</script>
</body>
</html>
